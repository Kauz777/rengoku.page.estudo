<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyojuro Rengoku - Efeito Traçado</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter', sans-serif; background:#111; color:white; overflow-x:hidden; }

/* --- Hero com vídeo --- */
.hero { position:relative; width:100%; height:100vh; overflow:hidden; display:flex; justify-content:center; align-items:center; }
.hero video { 
  width:100%; 
  height:100%; 
  object-fit:cover; 
  object-position:center center; 
  position:absolute; 
  top:0; left:0; 
  z-index:0;
}
.hero .content {
  position:relative;
  z-index:1; /* garante que fique acima do vídeo */
  text-align:center;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
}

/* Texto com traçado */
.hero .content h1 {
  font-size: 100px;
  color: rgba(253,97,25,0.7);
  -webkit-text-stroke: 2px rgba(253,97,25,0.9);
  text-stroke: 2px rgba(253,97,25,0.9);
  opacity: 0;
  transform: translateY(50px);
  transition: all 0.8s ease-out;
  margin-bottom:0.25rem;
}
.hero .content h2 {
  font-size: 50px;
  color: rgba(155,24,1,0.85);
  -webkit-text-stroke: 1.5px rgba(155,24,1,1);
  text-stroke: 1.5px rgba(155,24,1,1);
  opacity: 0;
  transform: translateY(50px);
  transition: all 0.8s ease-out;
  margin-bottom: 10px;
}

/* Ícone do Instagram */
.instagram-icon {
  font-size: 50px;
  color: #fff; 
  opacity: 0;
  transform: translateY(50px);
  transition: all 0.8s ease-out;
  margin-top: 10px;
}
.instagram-icon:hover { color:#e1306c; }

/* --- Seções abaixo --- */
.section { padding:80px 20px; text-align:center; max-width:1000px; margin:0 auto; }
.animate { opacity:0; transform:translateY(50px); transition: all 0.8s ease-out; }
.show { opacity:1; transform:translateY(0); }

/* Galeria centralizada */
.gallery { 
  display:flex; 
  justify-content:center; 
  flex-wrap:wrap; 
  gap:20px; 
  margin-top:40px;
}
.gallery img { 
  width:150px; 
  height:150px; 
  object-fit:cover; 
  border-radius:8px; 
  box-shadow:0 4px 10px rgba(0,0,0,0.7); 
  transition: transform 0.3s ease, box-shadow 0.3s ease; 
  cursor:pointer; 
}
.gallery img:hover { 
  transform:scale(1.1); 
  box-shadow:0 8px 20px rgba(255,255,255,0.9); 
}

/* --- Ajustes para mobile --- */
@media (max-width: 768px) {
  .hero .content h1 { font-size: 50px; }
  .hero .content h2 { font-size: 30px; }
  .instagram-icon { font-size: 35px; }

  .gallery { gap:15px; justify-content:center; }
  .gallery img { width:100px; height:100px; }
}
</style>
</head>
<body>

<div class="hero">
  <video autoplay muted loop playsinline>
    <source src="./background/video/rengocku background.mp4" type="video/mp4">
    Seu navegador não suporta vídeo HTML5.
  </video>
  <div class="content">
    <h1 id="hero-h1">Kyojuro</h1>
    <h2 id="hero-h2">Rengoku</h2>

    <a href="https://www.instagram.com/kauz7k/" target="_blank">
      <i class="fab fa-instagram instagram-icon animate"></i>
    </a>
  </div>
</div>

<div class="section">
  <h3 class="animate">Sobre o Personagem</h3>
  <p class="animate">Kyojuro Rengoku é o Pilar do Fogo em Demon Slayer. Conhecido por sua energia incansável e coração corajoso, ele luta para proteger os inocentes e inspirar todos ao seu redor com sua força e determinação.</p>

  <div class="gallery">
    <img class="animate" src="./image/1.jpg" alt="Imagem 1">
    <img class="animate" src="./image/2.jpg" alt="Imagem 2">
    <img class="animate" src="./image/3.jpg" alt="Imagem 3">
    <img class="animate" src="./image/4.jpg" alt="Imagem 4">
    <img class="animate" src="./image/5.jpg" alt="Imagem 5">
  </div>
</div>

<script>
// Hero - animação do nome
const heroH1 = document.getElementById('hero-h1');
const heroH2 = document.getElementById('hero-h2');
const instagramIcon = document.querySelector('.instagram-icon');

window.addEventListener('load', () => {
  setTimeout(()=>{ heroH1.style.opacity='1'; heroH1.style.transform='translateY(0)'; }, 200);
  setTimeout(()=>{ heroH2.style.opacity='1'; heroH2.style.transform='translateY(0)'; }, 400);
  setTimeout(()=>{ instagramIcon.style.opacity='1'; instagramIcon.style.transform='translateY(0)'; }, 600);
});

// Scroll animation para seções e galeria
const animatedElements = document.querySelectorAll('.animate');
function handleScroll() {
  const triggerBottom = window.innerHeight * 0.85;
  animatedElements.forEach((el,index)=>{
    const boxTop = el.getBoundingClientRect().top;
    if(boxTop < triggerBottom){
      setTimeout(()=>{ el.classList.add('show'); }, index*100);
    } else {
      el.classList.remove('show');
    }
  });
}
window.addEventListener('scroll', handleScroll);
</script>

</body>
</html>
